<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Novel Studio 素材匣</title><link rel="stylesheet" href="popup.css"></head>
<body><header><span>NOVEL STUDIO · 測試版</span><h1>先收下靈感，稍後再整理</h1><p>網頁反白後按右鍵收集，或在這裡寫一張便條。</p></header>
<aside class="privacy-intro" aria-label="收集資料說明"><strong>你的素材留在這台電腦</strong><p>你主動收集時，會保存選取文字、網頁標題、來源網址與時間；便條草稿也會自動保留。不會背景讀取其他網頁或上傳。網址可能含私人參數，分享匯出檔前請檢查。</p><a href="privacy.html" target="_blank" rel="noreferrer">資料使用與刪除說明</a></aside>
<form id="note-form"><label for="note">隨手便條</label><textarea id="note" rows="3" maxlength="20000" placeholder="寫下突然想到的情節…" required></textarea><label class="source-option"><input type="checkbox" id="include-source">附上目前網頁來源</label><button id="save" type="submit">收進素材匣</button></form>
<p id="status" role="status" aria-live="polite"></p><section><div class="list-heading"><h2>待整理 <span id="count">0</span></h2><button id="export" type="button">匯出全部</button></div><label for="search">尋找素材</label><input id="search" type="search" placeholder="搜尋文字、標題或來源"><div id="entries"></div></section>
<footer>本機儲存，沒有自動上傳。匯出後，到 Novel Studio「專案與備份 → 匯入瀏覽器素材」。移除擴充功能會清除本機素材；請先匯出。摘錄仍須遵守來源的使用授權。</footer><script type="module" src="popup.js"></script></body></html>
